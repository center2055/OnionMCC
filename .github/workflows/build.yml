name: Build Standalone EXE

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build and Package EXE
      run: .\gradlew.bat :launcher:build :launcher:createExe -x test

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnionMCC-Standalone
        path: launcher/build/launch4j/OnionMCC.exe
