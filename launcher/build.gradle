plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'edu.sc.seis.launch4j' version '3.0.5'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

application {
    mainClass = 'com.onionmcc.launcher.Main'
}

dependencies {
    implementation project(':client')
    implementation files("${System.getProperty('java.home')}/../lib/tools.jar").filter { it.exists() }
}

task copyPayloads(type: Copy) {
    dependsOn ':agent:jar', ':client:jar'
    from project(':agent').layout.buildDirectory.dir('libs')
    from project(':client').layout.buildDirectory.dir('libs')
    include 'onionmcc-agent-*.jar'
    include 'onionmcc-client-*.jar'
    into "${projectDir}/src/main/resources/payloads"
}

processResources.dependsOn copyPayloads

jar {
    manifest {
        attributes(
            'Main-Class': 'com.onionmcc.launcher.Main'
        )
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'onionmcc-launcher'
}

launch4j {
    mainClassName = 'com.onionmcc.launcher.Main'
    outfile = 'OnionMCC.exe'
    productName = 'OnionMCC'
    fileDescription = 'OnionMCC Ghost Client Launcher'
    copyright = '2026'
    jreMinVersion = '17'
    icon = "${projectDir}/src/main/resources/assets/logo.ico"
}
